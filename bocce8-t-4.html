    // Function to total wins and set globals
    function calculateTeamWins(weeks) {
      const wins = Array(16).fill(0);
      //console.log(`calculateTeamWins: weeks=${weeks}`);
      // Loop through each week
      weeks.forEach(week => {
        for (let i = 1; i < week.length; i++) {
          const teamNumber = week[i];
          if (teamNumber >= 1 && teamNumber <= 16) {
            wins[teamNumber - 1]++;
          }
        }
      });

      // Set global gamesPlayed
      gamesPlayed = weeks.length;

      // Get last week's date (yyyymmdd format at position 0)
      const lastWeekDate = weeks[weeks.length - 1][0]; // e.g. "2025-12-15"
      const yyyy = lastWeekDate.substring(0, 4);
      const mm   = lastWeekDate.substring(5, 7);
      const dd   = lastWeekDate.substring(8, 10);

      // Set global asOfDate in mm/dd/yyyy format
      asOfDate = mm + "/" + dd + "/" + yyyy;

      // Calculate total games won (sum of wins array)
      gamesWon = wins.reduce((sum, val) => sum + val, 0);

      // Display info message
      console.info("Games Played:", gamesPlayed, 
                   "Games Won:", gamesWon, 
                   "As Of:", asOfDate, 
                   "Wins:", wins);

      return wins;
    }

	function positionModal(event, modalContent) {
		const padding = 10;
		const modalWidth = modalContent.offsetWidth || 300;
		const modalHeight = modalContent.offsetHeight || 200;

		// Use pageX/Y for document-relative positioning
		let x = event.pageX + padding;
		let y = event.pageY + padding;
	
		// Clamp to viewport bounds
		if (x + modalWidth > window.innerWidth + window.scrollX) {
			x = window.innerWidth + window.scrollX - modalWidth - padding;
		}
		if (y + modalHeight > window.innerHeight + window.scrollY) {
			y = window.innerHeight + window.scrollY - modalHeight - padding;
		}

		modalContent.style.position = 'absolute';
		modalContent.style.left = `${x}px`;
		modalContent.style.top = `${y}px`;
		modalContent.style.zIndex = 1000;
	}

	// --- Parse CSV ---
	function parseCsv(text) {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`); 	
	  console.log(`parseCvs: parsing CSV data...`);
	  const lines = text.trim().split(/\r?\n/);
	  for (let i = 1; i < lines.length; i++) {
		const cols = lines[i].split(",");
		const date = cols[0];
		const time = cols[1];
		const court1 = parseGameText(cols[2]);
		const court2 = parseGameText(cols[3]);

		if (!scheduleByDate[date]) scheduleByDate[date] = [];
		scheduleByDate[date].push({
		  date,
		  time,
		  court1,
		  court2
		});
	  }
	}

	// Parse "Game 1: Team 11 vs Team 4"
	function parseGameText(text) {
	  let main = text.split("—")[0].split("�")[0].trim();
	  const m = main.match(/^Game\s+(\d+):\s*(.+)\s+vs\s+(.+)$/i);
	  if (!m) return { raw:text, gameNumber:null };

	  return {
		raw:text,
		gameNumber:parseInt(m[1],10),
		sideA:parseSideRef(m[2].trim()),
		sideB:parseSideRef(m[3].trim())
	  };
	}

	function parseSideRef(str) {
	  let m = str.match(/^Winner\s+(\d+)$/i);
	  if (m) return { type:"winner", game:parseInt(m[1],10) };
	  m = str.match(/^Loser\s+(\d+)$/i);
	  if (m) return { type:"loser", game:parseInt(m[1],10) };
	  return { type:"team", name:str };
	}

	// --- Parse JSON results ---
	function parseJsonResults(json) {
	  console.log(`parseJsonResults: parsing JSON standings data...`);
	  json.weeks.forEach(week => {
		const date = week[0];
		const winners = week.slice(1);
		console.log(`parseJsonResults: date=${date}  winners=${winners}`)
		gameResults[date] = winners;
	  });
	}

		  <tr>
			<th>Time</th>
			<th>Game</th>
			<th>Court 1</th>
			<th>Game</th>
			<th>Court 2</th>
		  </tr>`;
		table.appendChild(thead);

		const tbody = document.createElement("tbody");
		tbody.dataset.date = date;

		scheduleByDate[date].forEach(row => {
		  const tr = document.createElement("tr");

		  const tdTime = document.createElement("td");
		  tdTime.textContent = row.time;
		  tr.appendChild(tdTime);

		  const tdGame1 = document.createElement("td");
		  tdGame1.textContent = row.court1.gameNumber ? `Game ${row.court1.gameNumber}` : "";
		  tr.appendChild(tdGame1);

		  const tdCourt1 = document.createElement("td");
		  tdCourt1.appendChild(renderGameCell(row.court1, date));
		  tr.appendChild(tdCourt1);

		  const tdGame2 = document.createElement("td");
		  tdGame2.textContent = row.court2.gameNumber ? `Game ${row.court2.gameNumber}` : "";
		  tr.appendChild(tdGame2);

		  const tdCourt2 = document.createElement("td");
		  tdCourt2.appendChild(renderGameCell(row.court2, date));
		  tr.appendChild(tdCourt2);

		  tbody.appendChild(tr);
		});

		if (idx > 0) tbody.classList.add("hidden");

		table.appendChild(tbody);
		section.appendChild(table);
		container.appendChild(section);
	  });
	}

	function formatDateold(dateStr) {
	  console.log(`formatDate: dateStr=${dateStr}`);
	  return new Date(dateStr).toLocaleDateString("en-US", {
		weekday:"long", month:"long", day:"numeric", year:"numeric"
	  });
	}

	function formatDate(dateStr) {
	  const [year, month, day] = dateStr.split("-").map(Number);
	  const d = new Date(year, month - 1, day); // local date, no timezone shift

	  return d.toLocaleDateString("en-US", {
		weekday: "long",
		month: "long",
		day: "numeric",
		year: "numeric"
	  });
	}

	// --- Render game cell ---
	function renderGameCell(gameObj, date) {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`); 	
	  //console.log('renderGameCell: Starting...');
	  const wrapper = document.createElement("div");

	  if (!gameObj.gameNumber) {
		wrapper.textContent = gameObj.raw;
		return wrapper;
	  }
	  
	  // Extract numeric team values	
	  const teamA_num = sideLabel(gameObj.sideA);
	  const teamB_num = sideLabel(gameObj.sideB);

	  const g = gameObj.gameNumber;
	  sideDomMap[g] = {};
	  tagDomMap[g] = {};

	  const lineA = document.createElement("div");
	  lineA.className = "team-line";
	  const iconA = document.createElement("span");
	  iconA.className = "neutral-icon";
	  iconA.textContent = "—";
	  const nameA = document.createElement("span");
	  nameA.className = "team-name";
	  nameA.textContent = padTeamNumber(sideLabel(gameObj.sideA));
	  //nameA.onclick = (event) => showTeamAt(event, teamA_num, teamB_num, "");
	  const tagA = document.createElement("span");
	  tagA.className = "tag";
	  lineA.appendChild(iconA);
	  lineA.appendChild(nameA);
	  lineA.appendChild(tagA);

	  sideDomMap[g].A = nameA;
	  tagDomMap[g].A = tagA;
	  tagDomMap[g].A.icon = iconA;

	  const lineB = document.createElement("div");
	  lineB.className = "team-line";
	  const iconB = document.createElement("span");
	  iconB.className = "neutral-icon";
	  iconB.textContent = "—";
	  const nameB = document.createElement("span");
	  nameB.className = "team-name";
	  nameB.textContent = padTeamNumber(sideLabel(gameObj.sideB));
	  //nameB.onclick = (event) => showTeamAt(event, teamA_num, teamB_num, "");
	  const tagB = document.createElement("span");
	  tagB.className = "tag";
	  lineB.appendChild(iconB);
	  lineB.appendChild(nameB);
	  lineB.appendChild(tagB);

	  sideDomMap[g].B = nameB;
	  tagDomMap[g].B = tagB;
	  tagDomMap[g].B.icon = iconB;
	  
	  // Create combined roster line (lineC)
	  const lineC = document.createElement("div");
	  lineC.style.fontWeight = "normal";
	  lineC.style.fontSize = "0.85rem";
	  lineC.style.cursor = "pointer";
	  lineC.style.color = "#444";
	  lineC.style.marginTop = "4px";
	  lineC.textContent = "(Click for team roster)";
	  lineC.onclick = (event) => showTeamAt(event, teamA_num, teamB_num, "");

	  const resultLine = document.createElement("div");
	  resultLine.className = "result-line";
	  resultLine.innerHTML = `
		<span>Winner: —</span>
		<span class="result-colon">:</span>
		<span>Loser: —</span>
	  `;
	  resultDomMap[g] = resultLine;

	  wrapper.appendChild(lineA);
	  wrapper.appendChild(lineB);
	  wrapper.appendChild(lineC); 
	  wrapper.appendChild(resultLine);

	  registerRefs(gameObj);
	  return wrapper;
	}

	function padTeamNumber(name) {
	  return name.replace(/Team (\d+)/, (_, num) => {
		//return num.length === 1 ? `Team  ${num}` : `Team ${num}`;
		return name.replace(/Team (\d+)/, (_, num) => `Team ${num.padStart(2, "0")}`);

	  });
	}

	function sideLabel(side) {
	  if (side.type === "team") return side.name;
	  if (side.type === "winner") return "Winner " + side.game;
	  if (side.type === "loser") return "Loser " + side.game;
	  return "";
	}

	function registerRefs(gameObj) {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`); 	
	  const g = gameObj.gameNumber;
	  ["sideA","sideB"].forEach(sideKey => {
		const side = gameObj[sideKey];
		if (side.type === "winner" || side.type === "loser") {
		  const src = side.game;
		  if (!gameRefs[src]) gameRefs[src] = [];
		  gameRefs[src].push({
			targetGame:g,
			side:sideKey === "sideA" ? "A" : "B",
			refType:side.type
		  });
		  //console.log(`src=${src}`);
		  //console.log(gameRefs[src]);
		}
	  });
	}

	// --- Apply saved JSON results ---
	function applySavedResults() {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`); 	
	
	  const dates = Object.keys(scheduleByDate).sort();
	  //console.log(`applySavedResults: dates=${dates}`);
	  dates.forEach(date => {
		//console.log(`applySavedResults: date=${date}`);
		const winners = gameResults[date];
		//console.log(`applySavedResults: winners=${winners}`);
		if (!winners) return;

		const rows = scheduleByDate[date];

		rows.forEach((row, idx) => {
		  const g1 = row.court1.gameNumber;
		  const g2 = row.court2.gameNumber;

		  if (g1 && winners[idx] !== undefined) {
			applyWinnerLoser(g1, winners[idx], winners);
		  }
		  if (g2 && winners[idx+1] !== undefined) {
			applyWinnerLoser(g2, winners[idx+1], winners);
		  }
		});

		revealNextRound(date);
	  });
	}

	function applyWinnerLoser(gameNumber, winningTeamNumber, winners) {	
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`);   
	  
	  const A = sideDomMap[gameNumber].A.textContent.trim();
	  const B = sideDomMap[gameNumber].B.textContent.trim();

	  // Extract numeric team number from "Team 02"
	  const aNum = parseInt(A.replace("Team ", ""), 10);
	  const bNum = parseInt(B.replace("Team ", ""), 10);

	  // Decide winner based on whether the team number is in the winners array
	  const winner = winners.includes(aNum) ? A : B;
	  const loser  = winners.includes(aNum) ? B : A;  

	  const iconA = tagDomMap[gameNumber].A.icon;
	  const iconB = tagDomMap[gameNumber].B.icon;

	  if (winner === A) {
		iconA.textContent = "✔";
		iconA.className = "winner-icon";
		iconB.textContent = "✖";
		iconB.className = "loser-icon";
		tagDomMap[gameNumber].A.textContent = "Won";
		tagDomMap[gameNumber].B.textContent = "Lost";
	  } else {
		iconB.textContent = "✔";
		iconB.className = "winner-icon";
		iconA.textContent = "✖";
		iconA.className = "loser-icon";
		tagDomMap[gameNumber].B.textContent = "Won";
		tagDomMap[gameNumber].A.textContent = "Lost";
	  }
	  teamNameMap[`Winner ${gameNumber}`] = winner;
	  teamNameMap[`Loser ${gameNumber}`] = loser;
	  updateDependentGames(gameNumber, winner, loser);
	}

	function updateDependentGames(srcGame, winner, loser) {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      //console.log(`Starting function: ${name}`); 
	  //console.log(`srcGame=${srcGame}  winner=${winner}  loser=${loser}`);
	  const refs = gameRefs[srcGame];
	  if (!refs) return;

	  refs.forEach(ref => {
		const dom = sideDomMap[ref.targetGame][ref.side];
		const tag = tagDomMap[ref.targetGame][ref.side];
		const icon = tag.icon;

		if (ref.refType === "winner") {
		  dom.textContent = padTeamNumber(winner);
		  icon.textContent = "—";
		  icon.className = "neutral-icon";
		  tag.textContent = "(w g" + srcGame + ")";
		} else {
		  dom.textContent = padTeamNumber(loser);
		  icon.textContent = "—";
		  icon.className = "neutral-icon";
		  tag.textContent = "(l g" + srcGame + ")";
		}
	  });
	}
	
	function urlHasCsvFlag() {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`); 	
		const params = new URLSearchParams(window.location.search);
		return params.get("csv") === "yes";
	}
	

	function revealNextRound(date) {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`); 	
	  const dates = Object.keys(scheduleByDate).sort();
	  const idx = dates.indexOf(date);
	  const nextDate = dates[idx+1];
	  if (!nextDate) return;

	  document.querySelector(`tbody[data-date="${nextDate}"]`).classList.remove("hidden");
	}
	
	function generateNextRoundCsv(nextRoundGames, nextRoundDate, nextRoundTime) {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`); 	
		// nextRoundGames = array of objects:
		// { gameNumber: 9, winnerOf: [1,2] } meaning Game 9 = Winner Game 1 vs Winner Game 2

		let rows = [];

		nextRoundGames.forEach(g => {
			const teamA = winners[g.winnerOf[0]] || `Winner Game ${g.winnerOf[0]}`;
			const teamB = winners[g.winnerOf[1]] || `Winner Game ${g.winnerOf[1]}`;

			const row = `${nextRoundDate},${nextRoundTime},Game ${g.gameNumber}: ${teamA} vs ${teamB}`;
			rows.push(row);
		});

		document.getElementById("nextRoundCsv").value = rows.join("\n");
	}
	
	
	function copyNextRoundCsv() {
	  const stack = new Error().stack.split("\n")[1];
      const name = stack.match(/at (\S+)/)[1];
      console.log(`Starting function: ${name}`); 	
		const textarea = document.getElementById("nextRoundCsv");

		textarea.select();
		textarea.setSelectionRange(0, textarea.value.length); // mobile support

		navigator.clipboard.writeText(textarea.value)
			.then(() => {
				// Optional: brief visual feedback
				const btn = document.getElementById("copyCsvBtn");
				const oldText = btn.textContent;
				btn.textContent = "Copied!";
				setTimeout(() => btn.textContent = oldText, 1200);
			})
			.catch(err => {
				alert("Copy failed — your browser may not support clipboard API.");
			});
	}


</script>
